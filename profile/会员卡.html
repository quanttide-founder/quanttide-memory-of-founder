<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莲意古韵 · 年度会员卡</title>
<style>
    /* 基础设置：清空默认边距，使用系统字体 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft Yahei", sans-serif;
    }

    /* 海报主容器：模拟手机屏幕比例 */
    .poster {
        width: 100%;
        max-width: 480px;
        background-color: #FAF6F2; /* 温和的米白色背景 */
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        padding: 40px 32px; /* 统一的内边距（左边距） */
        color: #333;
        position: relative;
        overflow: hidden;
    }

    /* 模块1：头部品牌区 */
    .header {
        margin-bottom: 40px;
    }
    .header h1 {
        font-size: 24px;
        color: #A02020; /* 中国红 */
        margin-bottom: 8px;
        letter-spacing: 1px;
    }
    .header p {
        font-size: 13px;
        color: #777;
        letter-spacing: 0.5px;
    }

    /* 模块2：价格与核心定位 */
    .pricing {
        margin-bottom: 32px;
    }
    .pricing .price {
        font-size: 56px;
        font-weight: 700;
        color: #A02020;
        line-height: 1;
        display: flex;
        align-items: baseline;
    }
    .pricing .price span {
        font-size: 16px;
        font-weight: normal;
        color: #555;
        margin-left: 8px;
    }
    .pricing .tagline {
        font-size: 16px;
        font-weight: 600;
        color: #333;
        margin-top: 12px;
    }

    /* 模块3：会员日福利 */
    .member-day {
        margin-bottom: 40px;
        display: flex;
        align-items: center;
        font-size: 14px;
        color: #A02020;
        background-color: #FDF0F0; /* 极淡的红色高亮 */
        padding: 12px 16px;
        border-radius: 6px;
    }
    .member-day .icon {
        margin-right: 8px;
        font-size: 16px;
    }

    /* 模块4：主权益三选一（严格三列网格） */
    .benefits {
        margin-bottom: 40px;
    }
    .benefits h3 {
        font-size: 16px;
        color: #A02020;
        margin-bottom: 16px;
        border-bottom: 1px solid #EEDCDC; /* 极细的分割线 */
        padding-bottom: 8px;
    }
    .benefits-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr); /* 严格等分三列 */
        gap: 16px; /* 列间距 */
    }
    .benefit-item {
        display: flex;
        flex-direction: column;
    }
    .benefit-item .num {
        font-size: 12px;
        color: #A02020;
        margin-bottom: 6px;
    }
    .benefit-item h4 {
        font-size: 14px;
        color: #333;
        margin-bottom: 6px;
        font-weight: 600;
    }
    .benefit-item p {
        font-size: 12px;
        color: #777;
        line-height: 1.4;
    }

    /* 模块5：限时加赠（重点促单区） */
    .promo {
        margin-bottom: 48px;
        text-align: left;
    }
    .promo .promo-title {
        font-size: 15px;
        font-weight: 700;
        color: #A02020;
        margin-bottom: 6px;
    }
    .promo .promo-sub {
        font-size: 12px;
        color: #777;
    }

    /* 模块6：情感共鸣 */
    .slogan {
        text-align: left;
        margin-bottom: 40px;
    }
    .slogan h2 {
        font-size: 18px;
        color: #333;
        font-weight: 600;
        margin-bottom: 8px;
    }
    .slogan p {
        font-size: 14px;
        color: #555;
    }

    /* 模块7：底部说明与装饰 */
    .footer {
        border-top: 1px solid #EEDCDC; /* 极细的分割线 */
        padding-top: 16px;
        position: relative;
    }
    .footer p {
        font-size: 10px;
        color: #999;
        line-height: 1.6;
        width: 85%; /* 留出空间给右下角图案 */
    }
    .footer .lotus {
        position: absolute;
        right: 0;
        bottom: -10px;
        font-size: 32px;
        color: #D16B6B;
        opacity: 0.6;
    }
</style>
</head>
<body>

<div class="poster">
    <!-- 头部 -->
    <header class="header">
        <h1>莲意古韵 · 年度会员卡</h1>
        <p>统管周三茶会 · 周六书语漫谈 · 个人品茗</p>
    </header>

    <!-- 价格 -->
    <section class="pricing">
        <div class="price">398 <span>元 / 年</span></div>
        <div class="tagline">一项会员身份，三种茶生活</div>
    </section>

    <!-- 会员日 -->
    <div class="member-day">
        <span class="icon">🎁</span>
        <span>会员日（每周三）购零售茶 · 一律七五折</span>
    </div>

    <!-- 主权益三选一 -->
   =" <section class="benefits">
        <h3>三选一 · 主权益</h3>
        <div class="benefits-grid">
            <div classbenefit-item">
                <span class="num">壹</span>
                <h4>周三茶会</h4>
                <p>全年免费参加</p>
            </div>
            <div class="benefit-item">
                <span class="num">贰</span>
                <h4>周六书语漫谈</h4>
                <p>全年免费参加</p>
            </div>
            <div class="benefit-item">
                <span class="num">叁</span>
                <h4>全年个人品茗</h4>
                <p>到店喝茶<br>全年48次</p>
            </div>
        </div>
    </section>

    <!-- 限时加赠 -->
    <section class="promo">
        <div class="promo-title">🔥 前50名会员 · 双会畅享</div>
        <div class="promo-sub">现有30位在列，三选一之外自动加赠另一场活动免费。</div>
    </section>

    <!-- 情感文案 -->
    <section class="slogan">
        <h2>一卡在手，每周都有个茶约。</h2>
        <p>给心灵，放个假。</p>
    </section>

    <!-- 底部说明 -->
    <footer class="footer">
        <p>说明：活动以到店为准；个人品茗为到店品饮（全年48次），不含茶礼盒零售。</p>
        <div class="lotus">✿</div>
    </footer>
</div>

</body>
</html>
