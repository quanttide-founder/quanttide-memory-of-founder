# 把散落在各档案里的「反应是 / 适用条件 / 这条线排除的是」显式化为定向关系，
# 即一组「对象 + 态射」。对象 = 档案条目；态射 kind 取值：
#   evokes       触发点 → 情绪
#   responds_to  情境（触发点 / 情绪）→ 方法
#   serves       方法 → 价值
#   excludes     价值 → 排除的形态
#
# 本文件只描述结构与连接；「什么时候归 profile」的判据仍在 profile.yaml。
# 改动条目名时，两处需同步。

